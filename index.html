<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClawCount · Token Cost Estimator</title>
  <meta name="description" content="Estimate AI token costs across 7 models from 5 providers. No token knowledge required.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦞</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="container">

  <header>
    <div class="logo">
      <div class="logo-icon">🦞</div>
      <div class="logo-text">Claw<span>Count</span></div>
    </div>
    <span id="tagline" class="tagline"></span>
    <div class="header-right">
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <div class="header-tag"><span class="live-dot"></span>&nbsp;<span id="headerTag"></span></div>
    </div>
  </header>

  <div class="section-label" id="sectionTask"></div>
  <div class="task-grid" id="taskGrid"></div>

  <div class="main-grid">
    <div>
      <div class="section-label" id="sectionParams"></div>
      <div class="panel" style="margin-bottom:24px">
        <div class="panel-header">
          <span class="panel-title" id="panelTitle"></span>
          <span style="font-family:var(--mono);font-size:11px;color:var(--text3)" id="totalTokensDisplay">0 tokens</span>
        </div>
        <div class="panel-body">
          <div class="slider-row">
            <div class="slider-label">
              <span class="slider-name" id="inputQ"></span>
              <span class="slider-value" id="inputHumanVal">—</span>
            </div>
            <input type="range" id="inputHumanSlider" min="0" max="7" step="1" value="2">
            <div class="slider-hints" id="inputHints"></div>
          </div>
          <div class="slider-row">
            <div class="slider-label">
              <span class="slider-name" id="outputQ"></span>
              <span class="slider-value" id="outputHumanVal">—</span>
            </div>
            <input type="range" id="outputHumanSlider" min="0" max="4" step="1" value="2">
            <div class="slider-hints" id="outputHints"></div>
          </div>
          <div class="slider-row">
            <div class="slider-label">
              <span class="slider-name" id="toolQ"></span>
              <span class="slider-value" id="toolHumanVal">—</span>
            </div>
            <input type="range" id="toolHumanSlider" min="0" max="4" step="1" value="1">
            <div class="slider-hints" id="toolHints"></div>
          </div>
          <div id="tokenTranslation"></div>
          <div class="scale-section">
            <div class="slider-label">
              <span class="slider-name" id="scaleQ"></span>
              <span class="slider-value" id="scaleDisplay">—</span>
            </div>
            <div class="scale-tabs" id="scaleTabs"></div>
          </div>
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-title" id="summaryTitle"></div>
        <div class="summary-stats">
          <div><div class="stat-label" id="statInput"></div><div class="stat-value" id="sumInput">—</div></div>
          <div><div class="stat-label" id="statOutput"></div><div class="stat-value" id="sumOutput">—</div></div>
          <div><div class="stat-label" id="statMin"></div><div class="stat-value" id="sumMin">—</div></div>
          <div><div class="stat-label" id="statMax"></div><div class="stat-value" id="sumMax">—</div></div>
        </div>
        <div class="rec-badge" id="recBadge">⚡ —</div>
      </div>
    </div>

    <div>
      <div class="section-label" id="sectionModels"></div>
      <div class="model-list" id="modelList"></div>
    </div>
  </div>

  <div class="footnote" id="footnote"></div>

  <div class="credit">
    <span>Built by</span>
    <a href="https://x.com/Frankie_iter" target="_blank" rel="noopener" class="credit-link">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-label="X (Twitter)">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.911-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      @Frankie_iter
    </a>
  </div>
</div>

<!-- Data must load before logic -->
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/calculator.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
